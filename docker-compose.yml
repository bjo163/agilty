services:
  gpt4free:
    image: hlohaus789/g4f:latest
    pull_policy: build
    init: true
    restart: unless-stopped
    shm_size: 2gb
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/app
      - g4f-data:/data/g4f
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:1337:8080'
      - '127.0.0.1:7900:7900'
    environment:
      - OLLAMA_HOST=host.docker.internal
      - ROCKSOUL_UI_ENABLED=${ROCKSOUL_UI_ENABLED:-1}
      - G4F_CONFIG_DIR=/data/g4f
      - G4F_API_KEY=${G4F_API_KEY:-}
      - G4F_GUI_TRUSTED_IPS=${G4F_GUI_TRUSTED_IPS:-172.30.0.1/32}
    networks:
      - rocksoul
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/backend-api/v2/status', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s

volumes:
  g4f-data:

networks:
  rocksoul:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
