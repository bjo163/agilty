name: ROCKSOUL Live Intelligence (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_live_probes:
        description: 'Explicitly authorize network calls to the configured providers'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-probes:
    if: ${{ inputs.confirm_live_probes == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover provider metadata without probing
        run: python -m g4f.rocksoul_db_cli discover
      - name: Run explicitly authorized bounded live probes
        env:
          ROCKSOUL_LIVE_PROBE: '1'
        run: python -m g4f.rocksoul_db_cli probe-all --model gpt-4o-mini --type smoke --concurrency 4 --timeout 20
