name: ROCKSOUL CI

on:
  push:
    branches: [main]
    paths:
      - 'g4f/gui/**'
      - 'tests/test_rocksoul_gui.py'
      - 'docs/rocksoul-*.md'
      - 'setup.py'
      - 'docker-compose.yml'
      - 'docker/Dockerfile'
      - '.github/workflows/rocksoul-ci.yml'
  pull_request:
    paths:
      - 'g4f/gui/**'
      - 'tests/test_rocksoul_gui.py'
      - 'docs/rocksoul-*.md'
      - 'setup.py'
      - 'docker-compose.yml'
      - 'docker/Dockerfile'
      - '.github/workflows/rocksoul-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimal runtime dependencies and API contract test dependencies
        run: |
          python -m pip install -r requirements-min.txt
          python -m pip install fastapi uvicorn httpx pytest flask
      - name: Compile runtime and ROCKSOUL modules
        run: python -m compileall -q g4f
      - name: Run ROCKSOUL GUI route and asset contract tests
        run: python -m pytest tests/test_rocksoul_gui.py -q
  package-build:
    name: Build and validate wheel / sdist
    runs-on: ubuntu-latest
    needs: deterministic-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build package using the active setup.py configuration
        env:
          G4F_VERSION: 0.0.0-dev
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Validate canonical Compose configuration
        run: docker compose config --quiet
      - name: Build canonical Docker image and verify bundled ROCKSOUL assets
        run: |
          docker build --build-arg G4F_VERSION=0.0.0-dev --tag rocksoul-ui-smoke --file docker/Dockerfile .
          docker run --rm --entrypoint python -e G4F_CONFIG_DIR=/data/g4f -v rocksoul-ui-smoke-data:/data/g4f rocksoul-ui-smoke -c "from importlib.resources import files; from pathlib import Path; assets = files(\"g4f\").joinpath(\"gui\", \"rocksoul\"); assert all(assets.joinpath(name).is_file() for name in (\"index.html\", \"app.css\", \"app.js\")); data = Path(\"/data/g4f\"); data.mkdir(parents=True, exist_ok=True); probe = data / \"volume-smoke.txt\"; probe.write_text(\"ok\"); assert probe.read_text() == \"ok\""
          docker volume rm rocksoul-ui-smoke-data

      - name: Install minimal runtime dependencies for entrypoint smoke tests
        run: python -m pip install -r requirements-min.txt

      - name: Install built wheel and smoke-test console scripts
        env:
          LOCALAPPDATA: ${{ runner.temp }}
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          from importlib.resources import files
          assets = files("g4f").joinpath("gui", "rocksoul")
          required = ("index.html", "app.css", "app.js")
          missing = [name for name in required if not assets.joinpath(name).is_file()]
          assert not missing, f"Missing ROCKSOUL wheel assets: {missing}"
          PY
          cd "$RUNNER_TEMP"
          rocksoul status
          rocksoul-db status
          rocksoul-mesh --help
          rocksoul-arena --help
          rocksoul-arena-production --help
          rocksoul-work --help
          rocksoul-work-graph --help
          rocksoul-legacy --help
          rocksoul-arena-production --db "$RUNNER_TEMP/rocksoul-wheel-smoke.db" fixture-campaign
          rocksoul-arena-production --db "$RUNNER_TEMP/rocksoul-wheel-smoke.db" list-campaigns
