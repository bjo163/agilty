name: ROCKSOUL Mesh CI

on:
  push:
    branches: [main]
    paths:
      - 'g4f/rocksoul_mesh.py'
      - 'g4f/rocksoul_mesh_cli.py'
      - 'tests/test_rocksoul_mesh*.py'
      - 'docs/rocksoul-mesh*.md'
      - '.github/workflows/rocksoul-mesh-ci.yml'
  pull_request:
    paths:
      - 'g4f/rocksoul_mesh.py'
      - 'g4f/rocksoul_mesh_cli.py'
      - 'tests/test_rocksoul_mesh*.py'
      - 'docs/rocksoul-mesh*.md'
      - '.github/workflows/rocksoul-mesh-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesh-contract:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal runtime dependencies
        run: python -m pip install -r requirements-min.txt
      - name: Compile Mesh implementation
        run: python -m compileall -q g4f/rocksoul_mesh.py g4f/rocksoul_mesh_cli.py
      - name: Run Mesh security, lifecycle, lease, and CLI tests
        run: python -m unittest discover -s tests -p "test_rocksoul_mesh*.py" -v
      - name: Verify operator CLI surface
        run: python -m g4f.rocksoul_mesh_cli --help
